# Single Sonar project scanning both backend + frontend
sonar.projectKey=thakurnishu_minimaldo-aws-devsecops_e6928345-abc2-46f2-8646-05d71cb09df4
sonar.projectName=minimaldo-monorepo
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Sources: backend root and frontend src
sonar.sources=services/backend,services/frontend/src
sonar.tests=services/backend,services/frontend/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.pb.go,**/*.gen.go,**/mock/**,**/mocks/**,**/dist/**,**/build/**,**/coverage/**

# Coverage files (paths relative to repo root)
sonar.go.coverage.reportPaths=services/backend/coverage.out
sonar.javascript.lcov.reportPaths=services/frontend/coverage/lcov.info
